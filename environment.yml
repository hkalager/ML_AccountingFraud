name: ml-fraud
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - numpy
  - pandas
  - matplotlib
  - scipy
  - scikit-learn=1.3.2
  - imbalanced-learn=0.12.0
  - statsmodels

# Optional developer tools
  - pip

  # pip section: installs pip-only packages; '-e .' will install this project
  # in editable/develop mode during env creation (PEP 660 support required)
  - pip:
    - -e .

# If you add pip-only dependencies later, list them here so conda remains the
# source of truth for development environment setup.